<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>2K Draft — NBA 2K Snake Draft</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&display=swap');
:root{
  --bg:#06080d; --panel:#0e1420; --panel2:#151d2c; --line:#212b3f;
  --txt:#eef2f8; --muted:#7e8ba1; --accent:#2e6bff; --accent2:#ff4d1c;
  --gold:#ffc136; --good:#2ee27e; --bad:#ff4d5e; --radius:8px;
  --disp:'Anton',Impact,sans-serif; --cond:'Barlow Condensed',Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{
  background:var(--bg);color:var(--txt);
  background-image:
    radial-gradient(1100px 500px at 50% -160px, rgba(46,107,255,.13), transparent 65%),
    radial-gradient(900px 500px at 100% 110%, rgba(255,77,28,.06), transparent 60%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.012) 0 2px, transparent 2px 9px);
  background-attachment:fixed;
  font:15px/1.5 'Barlow',-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
  -webkit-font-smoothing:antialiased;
}
h2,h3,h4{font-family:var(--cond);text-transform:uppercase;letter-spacing:.4px;font-weight:700}
button{font-family:var(--cond);cursor:pointer;border:none;border-radius:4px;font-weight:700;text-transform:uppercase;letter-spacing:.8px;transition:.15s}
button:disabled{opacity:.4;cursor:not-allowed}
input,select{font-family:'Barlow',sans-serif;background:var(--panel2);border:1px solid var(--line);color:var(--txt);border-radius:4px;padding:10px 12px;font-size:15px;outline:none;transition:border-color .15s}
input:focus,select:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(46,107,255,.18)}
a{color:var(--accent)}
.btn{background:linear-gradient(180deg,#3d78ff,#2257e0);color:#fff;padding:12px 20px;font-size:14px;box-shadow:0 2px 10px rgba(46,107,255,.35),inset 0 1px 0 rgba(255,255,255,.22)}
.btn:hover:not(:disabled){filter:brightness(1.12);transform:translateY(-1px)}
.btn.alt{background:var(--panel2);border:1px solid var(--line);color:var(--txt);box-shadow:none}
.btn.orange{background:linear-gradient(180deg,#ff5f2e,#e03a0c);box-shadow:0 2px 10px rgba(255,77,28,.35),inset 0 1px 0 rgba(255,255,255,.22)}
.btn.gold{background:linear-gradient(180deg,#ffd257,#f0a91c);color:#241800;box-shadow:0 2px 12px rgba(255,193,54,.35),inset 0 1px 0 rgba(255,255,255,.4)}
.btn.sm{padding:7px 13px;font-size:12px;border-radius:3px}
.wrap{max-width:1280px;margin:0 auto;padding:18px}
.center{max-width:560px;margin:6vh auto;padding:18px}
.card{background:linear-gradient(180deg,var(--panel),#0b101a);border:1px solid var(--line);border-top:2px solid var(--accent);border-radius:var(--radius);padding:22px;box-shadow:0 12px 34px rgba(0,0,0,.45)}
.logo{font-family:var(--disp);font-weight:400;font-size:34px;letter-spacing:1px;text-transform:uppercase;font-style:italic;text-shadow:0 2px 0 rgba(0,0,0,.5)}
.logo span{color:var(--accent2)}
.sub{color:var(--muted)}
.row{display:flex;gap:10px}
.row.wrap{flex-wrap:wrap}
.col{display:flex;flex-direction:column;gap:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}
label{font-family:var(--cond);font-size:13px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:1px}
.hide{display:none!important}
.pill{display:inline-flex;align-items:center;gap:6px;background:var(--panel2);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font-size:12px;font-family:var(--cond);font-weight:600;text-transform:uppercase;letter-spacing:.8px}
.tag{font-family:var(--cond);font-size:11px;font-weight:700;padding:2px 8px;border-radius:2px;text-transform:uppercase;letter-spacing:1px;transform:skewX(-8deg)}
.tag.cur{background:rgba(46,107,255,.18);color:#7ba4ff;border-left:2px solid var(--accent)}
.tag.leg{background:rgba(255,193,54,.16);color:var(--gold);border-left:2px solid var(--gold)}
.ovr{font-family:var(--disp);font-weight:400;font-size:16px;min-width:40px;text-align:center;border-radius:3px;padding:4px 0;transform:skewX(-6deg);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 2px 6px rgba(0,0,0,.4)}
.ovr.t99{background:linear-gradient(160deg,#ffd257,#e08f00);color:#241800}
.ovr.t90{background:linear-gradient(160deg,#c9d6e8,#8fa3bd);color:#101828}
.ovr.t80{background:linear-gradient(160deg,#d98a4f,#a2561f);color:#fff}
.ovr.t0{background:#333d52;color:#c3cbdb}
.toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:#04060a;border:1px solid var(--line);border-left:3px solid var(--accent);padding:12px 18px;border-radius:6px;z-index:99;opacity:0;transition:.25s;pointer-events:none;max-width:90vw;box-shadow:0 10px 30px rgba(0,0,0,.6)}
.toast.show{opacity:1}
/* draft layout */
.top{position:relative;display:flex;align-items:center;gap:18px;background:linear-gradient(90deg,#101a2e,var(--panel) 55%);border:1px solid var(--line);border-left:4px solid var(--accent2);border-radius:var(--radius);padding:12px 18px;flex-wrap:wrap;box-shadow:0 10px 28px rgba(0,0,0,.4)}
.clock{font-family:var(--disp);font-weight:400;font-size:32px;min-width:76px;text-align:center;color:var(--gold);background:#04060a;border:1px solid var(--line);border-radius:6px;padding:4px 10px;letter-spacing:2px;font-variant-numeric:tabular-nums;box-shadow:inset 0 2px 10px rgba(0,0,0,.8),0 0 18px rgba(255,193,54,.12);text-shadow:0 0 12px rgba(255,193,54,.5)}
.clock.warn{color:var(--bad);text-shadow:0 0 12px rgba(255,77,94,.6);box-shadow:inset 0 2px 10px rgba(0,0,0,.8),0 0 18px rgba(255,77,94,.25);animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.55}}
.onclock{font-family:var(--cond);font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:1px}
.onclock b{color:var(--txt);font-size:19px;letter-spacing:.5px}
.onclock.mine b{color:var(--good);text-shadow:0 0 10px rgba(46,226,126,.4)}
.dlayout{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:16px;align-items:start}
.poolhead{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-bottom:10px}
.chip{font-family:var(--cond);background:var(--panel2);border:1px solid var(--line);color:var(--muted);padding:6px 14px;border-radius:3px;font-size:13px;font-weight:600;text-transform:uppercase;letter-spacing:.8px;transition:.15s}
.chip.on{background:var(--accent);color:#fff;border-color:var(--accent);box-shadow:0 2px 10px rgba(46,107,255,.4)}
.plist{max-height:64vh;overflow:auto;border:1px solid var(--line);border-radius:var(--radius);background:var(--panel)}
.prow{display:flex;align-items:center;gap:12px;padding:9px 12px;border-bottom:1px solid rgba(33,43,63,.6)}
.prow:last-child{border-bottom:none}
.prow:hover{background:var(--panel2);box-shadow:inset 3px 0 0 var(--accent)}
.prow .nm{font-family:var(--cond);font-weight:600;font-size:17px;letter-spacing:.3px}
.prow .meta{font-size:12px;color:var(--muted)}
.prow.bpa{background:linear-gradient(90deg,rgba(255,193,54,.12),transparent);box-shadow:inset 3px 0 0 var(--gold)}
.grow{flex:1;min-width:0}
.nowrap{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tabs{display:flex;gap:6px;margin-bottom:10px}
.tab{font-family:var(--cond);background:transparent;border:none;border-bottom:3px solid var(--line);color:var(--muted);padding:8px 16px;border-radius:0;font-size:14px;font-weight:700;text-transform:uppercase;letter-spacing:1px;cursor:pointer;transition:.15s}
.tab.on{color:var(--txt);border-bottom-color:var(--accent2)}
.side{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:14px;max-height:72vh;overflow:auto}
.teamcard{border:1px solid var(--line);border-left:3px solid var(--line);border-radius:6px;padding:10px 12px;margin-bottom:10px;background:linear-gradient(180deg,rgba(255,255,255,.015),transparent)}
.teamcard.me{border-left-color:var(--good)}
.teamcard.turn{border-color:var(--gold);border-left-color:var(--gold);box-shadow:0 0 0 1px rgba(255,193,54,.35),0 0 22px rgba(255,193,54,.12)}
.teamcard h4{margin:0 0 2px;display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:15px}
.slot{display:flex;justify-content:space-between;gap:8px;font-size:13px;padding:3px 0;border-bottom:1px dashed rgba(33,43,63,.7)}
.slot:last-child{border-bottom:none}
.slot .pos{color:var(--accent2);width:30px;font-family:var(--cond);font-weight:700}
.bar{height:6px;background:var(--panel2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--good))}
.logfeed{font-size:13px}
.logfeed .li{padding:6px 0;border-bottom:1px solid rgba(33,43,63,.6);color:var(--muted)}
.logfeed .li b{color:var(--txt)}
.mem{display:flex;align-items:center;gap:8px;padding:8px 10px;background:var(--panel2);border-left:2px solid var(--accent);border-radius:4px;margin-bottom:6px}
.mem .dot{width:9px;height:9px;border-radius:50%;background:var(--good);box-shadow:0 0 8px rgba(46,226,126,.6)}
.num{width:26px;height:26px;border-radius:3px;background:var(--panel2);border:1px solid var(--line);display:inline-flex;align-items:center;justify-content:center;font-family:var(--cond);font-size:13px;font-weight:700;transform:skewX(-6deg)}
small.k{color:var(--muted)}
.banner{background:rgba(255,77,28,.1);border:1px solid rgba(255,77,28,.5);border-left:3px solid var(--accent2);color:#ffb499;padding:10px 14px;border-radius:4px;font-size:13px}
.confetti{position:fixed;width:10px;height:14px;top:-20px;z-index:80;will-change:transform}
@media(max-width:880px){.dlayout{grid-template-columns:1fr}.grid2{grid-template-columns:1fr}.plist{max-height:48vh}.logo{font-size:26px}.clock{font-size:26px;min-width:64px}}
</style>
</head>

/* ============================================================
   STORE ADAPTERS — same interface, two backends.
   LocalStore  : offline, single device, in-memory (pass & play)
   CloudStore  : Firebase Realtime DB, real-time across devices
   ============================================================ */
let DB=null;
if(FIREBASE_READY){ try{ firebase.initializeApp(firebaseConfig); DB=firebase.database(); }catch(e){ console.warn(e); } }

function CloudStore(){
  let code=null, cb=null, ref=null;
  return {
    online:true,
    async create(roomCode,room){ code=roomCode; ref=DB.ref("rooms/"+code); await ref.set(room); },
    async exists(roomCode){ const s=await DB.ref("rooms/"+roomCode).get(); return s.exists(); },
    setCode(c){ code=c; ref=DB.ref("rooms/"+code); },
    subscribe(fn){ cb=fn; ref.on("value",s=>cb(s.val())); },
    async update(patch){ await ref.update(patch); },
    async addMember(uid,m){ await ref.child("members/"+uid).set(m); },
    async pick(pickNo,obj,next){
      const cell=ref.child("picks/"+pickNo);
      const res=await cell.transaction(cur=> cur===null?obj:undefined );
      if(res.committed){ await ref.update(next); return true; }
      return false;
    },
    async setRaw(path,val){ await ref.child(path).set(val); }
  };
}
function LocalStore(){
  let room=null, cb=null;
  const emit=()=>cb&&cb(JSON.parse(JSON.stringify(room)));
  return {
    online:false,
    async create(roomCode,r){ room=r; emit(); },
    async exists(){ return true; },
    setCode(){},
    subscribe(fn){ cb=fn; emit(); },
    async update(patch){ Object.assign(room,patch); emit(); },
    async addMember(uid,m){ room.members=room.members||{}; room.members[uid]=m; emit(); },
    async pick(pickNo,obj,next){ room.picks=room.picks||{}; if(room.picks[pickNo])return false;
      room.picks[pickNo]=obj; Object.assign(room,next); emit(); return true; },
    async setRaw(path,val){ const parts=path.split("/"); let o=room; while(parts.length>1){o=o[parts.shift()]=o[parts[0]]&&o[parts.shift?parts[0]:0]||o[parts[0]];} room[path]=val; emit(); }
  };
}

let store=null, ME={uid:null,name:null,isHost:false,code:null,mode:null}, ROOM=null, autoTimer=null, tick=null, confettiShown=false;

function pickerUidForPickNo(room,pn){
  const order=room.order||[]; const N=order.length; if(!N)return null;
  const r=Math.floor(pn/N), i=pn%N;
  const pos=(room.cfg.snake && r%2===1)? N-1-i : i;
  return order[pos];
}
function totalPicks(room){ return (room.order?room.order.length:0)*room.cfg.rosterSize; }
function takenIds(room){ const s=new Set(); const pk=room.picks||{}; for(const k in pk)s.add(pk[k].pid); return s; }
function teamPicks(room,uid){ const out=[]; const pk=room.picks||{}; const keys=Object.keys(pk).map(Number).sort((a,b)=>a-b);
  for(const k of keys)if(pk[k].uid===uid)out.push(pk[k]); return out; }
function avgOvr(picks){ if(!picks.length)return 0; return Math.round(picks.reduce((a,p)=>a+p.ovr,0)/picks.length); }
function sumOvr(picks){ return picks.reduce((a,p)=>a+p.ovr,0); }

}

async function doJoin(v){
  if(!FIREBASE_READY)return toast("Online play needs Firebase config (see SETUP.md)");
  const name=$("#jName",v).value.trim(); const code=$("#jCode",v).value.trim().toUpperCase();
  if(!name)return toast("Enter your name");
  if(code.length<4)return toast("Enter the 4-letter code");
  store=CloudStore(); store.setCode(code);
  if(!(await store.exists(code)))return toast("No room found with that code");
  ME.uid=uuid(); ME.name=name; ME.isHost=false; ME.code=code; ME.mode="online";
  await store.addMember(ME.uid,{name,joinedAt:Date.now()});
  store.subscribe(onRoom);
  save({uid:ME.uid,name:ME.name,isHost:false,code,mode:"online"});
}

function onRoom(r){
  if(!r){ toast("Room was closed"); leave(); return; }
  ROOM=r; render();
}

function leave(){ localStorage.removeItem("nba2kdraft"); ROOM=null; ME={uid:null}; confettiShown=false; if(autoTimer){clearInterval(autoTimer);autoTimer=null;} render(); }

/* ---------- LOBBY ---------- */
function lobbyView(){
  const v=el("div","wrap"); const r=ROOM; const mems=Object.entries(r.members||{});
  const isHost=ME.uid===r.host;
  v.innerHTML=`
   <div class="row" style="justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px">
     <div class="logo">2K<span>DRAFT</span> <span class="sub" style="font-size:15px;font-weight:600">· Lobby</span></div>
     <div class="row wrap">
       <span class="pill">Room code <b style="letter-spacing:3px;font-size:18px;margin-left:6px">${esc(ME.code)}</b></span>
       <span class="pill">${r.cfg.rosterSize}-player rosters</span>
       <span class="pill">${r.cfg.timer?r.cfg.timer+"s clock":"No timer"}</span>
       <span class="pill">${r.cfg.snake?"Snake":"Straight"}</span>
       <span class="pill">${r.cfg.pool==="all"?"Current + Legends":r.cfg.pool==="current"?"Current only":"Legends only"}</span>
     </div>
   </div>
   <div class="grid2" style="margin-top:18px">
     <div class="card">
       <h3 style="margin:0 0 4px">Teams <span class="sub">(${mems.length}/30)</span></h3>
       <div class="sub" style="font-size:13px;margin-bottom:12px">${ME.mode==="online"?"Share the room code. Everyone who joins gets a team.":"Add each person playing on this device."}</div>
       <div id="memList"></div>
       ${ME.mode==="local"&&isHost?`<div class="row" style="margin-top:10px"><input id="addName" placeholder="Add player name" maxlength="16" style="flex:1"><button class="btn alt" id="addBtn">Add</button></div>`:""}
     </div>
     <div class="card">
       <h3 style="margin:0 0 10px">How it works</h3>
       <div class="sub" style="font-size:14px">
         <p>Players are drafted <b>${r.cfg.snake?"snake-style":"in fixed order"}</b>: each team builds a ${r.cfg.rosterSize}-man roster from ${r.cfg.pool==="current"?"current NBA":r.cfg.pool==="legend"?"all-time legend":"current + legend"} players.</p>
         <p>When the draft starts, pick order is <b>randomized</b>. ${r.cfg.timer?`If a pick isn't made within <b>${r.cfg.timer}s</b>, the best available player is auto-drafted.`:""}</p>
         <p>Final standings rank teams by <b>average overall</b>.</p>
       </div>
       ${isHost?`<button class="btn gold" id="startBtn" style="width:100%;margin-top:8px">🏀 Randomize order & start draft</button>
         <div class="sub" style="font-size:12px;margin-top:8px;text-align:center">Need at least 2 teams.</div>`
        :`<div class="banner">Waiting for the host to start the draft…</div>`}
       <button class="btn alt sm" id="leaveBtn" style="margin-top:12px">Leave</button>
     </div>
   </div>`;
  const ml=$("#memList",v);
  mems.sort((a,b)=>a[1].joinedAt-b[1].joinedAt).forEach(([uid,m],i)=>{
    const row=el("div","mem");
    row.innerHTML=`<span class="num">${i+1}</span><span class="dot"></span><b>${esc(m.name)}</b>${uid===r.host?'<span class="tag cur" style="margin-left:auto">HOST</span>':''}${uid===ME.uid?'<span class="sub" style="margin-left:auto;font-size:12px">you</span>':''}`;
    if(ME.mode==="local"&&isHost&&uid!==r.host){
      const x=el("button","btn alt sm","✕"); x.style.marginLeft="auto";
      x.onclick=async()=>{ const mm={...r.members}; delete mm[uid]; await store.update({members:mm}); };
      row.appendChild(x);
    }
    ml.appendChild(row);
  });
  if(ME.mode==="local"&&isHost){
    const ab=$("#addBtn",v), ai=$("#addName",v);
    const add=async()=>{ const n=ai.value.trim(); if(!n)return; if(Object.keys(r.members).length>=30)return toast("Max 30 teams");
      await store.addMember(uuid(),{name:n,joinedAt:Date.now()}); ai.value=""; ai.focus(); };
    ab.onclick=add; ai.onkeydown=e=>{if(e.key==="Enter")add();};
  }
  const sb=$("#startBtn",v); if(sb)sb.onclick=startDraft;
  $("#leaveBtn",v).onclick=leave;
  return v;
}

async function startDraft(){
  const r=ROOM; const ids=Object.keys(r.members);
  if(ids.length<2)return toast("Need at least 2 teams to start");
  const need=ids.length*r.cfg.rosterSize;
  const have=PLAYERS.filter(p=>r.cfg.pool==="all"?true:p.era===r.cfg.pool).length;
  if(need>have)return toast(`Not enough players: ${ids.length} teams × ${r.cfg.rosterSize} = ${need} needed, but only ${have} in this pool. Lower roster size or widen the pool.`);
  // randomize order
  for(let i=ids.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[ids[i],ids[j]]=[ids[j],ids[i]];}
  await store.update({order:ids, status:"draft", pickNo:0,
    deadline:r.cfg.timer?Date.now()+r.cfg.timer*1000:0});
  toast("Draft started — good luck!");
}

/* ---------- DRAFT ---------- */
let UI={tab:"teams", q:"", pos:"ALL", era:"ALL", sort:"ovr"};
function draftView(){
  const r=ROOM; const v=el("div","wrap");
  const pn=r.pickNo, total=totalPicks(r), done=r.status==="done"||pn>=total;
  const curUid=done?null:pickerUidForPickNo(r,pn);
  const myTurn=curUid===ME.uid && !done;
  const canPick = !done && (ME.mode==="local" || myTurn); // local: one device drafts for whoever is on the clock
  const round=Math.floor(pn/r.order.length)+1, rounds=r.cfg.rosterSize;
  // header
  const top=el("div","top");
  top.innerHTML=`
    <div class="logo" style="font-size:22px">2K<span>DRAFT</span></div>
    ${done?`<div class="onclock"><b>Draft complete 🎉</b></div>`:
    `<div class="clock" id="clock">${r.cfg.timer?"—":"∞"}</div>
     <div class="onclock ${canPick?"mine":""}">On the clock<br><b>${(ME.mode==="online"&&myTurn)?"YOU":esc(r.members[curUid]?.name||"…")}</b></div>
     <div class="onclock">Round <b>${round}</b>/${rounds} · Pick <b>${pn+1}</b>/${total}</div>`}
    <div style="margin-left:auto" class="row wrap">
      <span class="pill">${esc(ME.code)}</span>
      ${ME.uid===r.host&&!done?`<button class="btn alt sm" id="undoBtn">↩ Undo</button>`:""}
      ${done?`<button class="btn gold sm" id="exportBtn">⬇ Export results</button>`:""}
      <button class="btn alt sm" id="leaveBtn2">Exit</button>
    </div>`;
  v.appendChild(top);

  if(done){ v.appendChild(resultsView());
    const eb=$("#exportBtn",top); if(eb)eb.onclick=exportResults;
    $("#leaveBtn2",top).onclick=leave;
    if(!confettiShown){confettiShown=true;confetti();}
    return v; }

  const layout=el("div","dlayout");
  // ---- left: pool ----
  const left=el("div","");
  const head=el("div","poolhead");
  head.innerHTML=`<input id="q" placeholder="Search players…" value="${esc(UI.q)}" style="flex:1;min-width:160px">
    <select id="sort"><option value="ovr">Sort: Overall</option><option value="name">Sort: Name</option></select>`;
  left.appendChild(head);
  const chips=el("div","poolhead");
  ["ALL",...POSES].forEach(p=>{const c=el("div","chip"+(UI.pos===p?" on":""),p==="ALL"?"All pos":p);c.onclick=()=>{UI.pos=p;render();};chips.appendChild(c);});
  if(r.cfg.pool==="all"){
    [["ALL","All"],["current","Current"],["legend","Legends"]].forEach(([k,lab])=>{
      const c=el("div","chip"+(UI.era===k?" on":""),lab);c.onclick=()=>{UI.era=k;render();};chips.appendChild(c);});
  }
  left.appendChild(chips);
  const list=el("div","plist"); left.appendChild(list);
  const taken=takenIds(r);
  let pool=PLAYERS.filter(p=>!taken.has(p.id));
  if(r.cfg.pool!=="all")pool=pool.filter(p=>p.era===r.cfg.pool);
  if(UI.era!=="ALL")pool=pool.filter(p=>p.era===UI.era);
  if(UI.pos!=="ALL")pool=pool.filter(p=>p.pos.split("/").includes(UI.pos));
  if(UI.q){const q=UI.q.toLowerCase();pool=pool.filter(p=>p.name.toLowerCase().includes(q)||p.team.toLowerCase().includes(q));}
  pool.sort(UI.sort==="name"?(a,b)=>a.name.localeCompare(b.name):(a,b)=>b.ovr-a.ovr||a.name.localeCompare(b.name));
  const bpaId=pool.length?[...pool].sort((a,b)=>b.ovr-a.ovr)[0].id:-1;
  pool.slice(0,300).forEach(p=>{
    const row=el("div","prow"+(p.id===bpaId&&canPick?" bpa":""));
    row.innerHTML=`<div class="ovr ${ovrClass(p.ovr)}">${p.ovr}</div>
      <div class="grow"><div class="nm nowrap">${esc(p.name)} ${p.id===bpaId&&canPick?'<span class="tag" style="background:rgba(255,201,77,.18);color:var(--gold)">BEST</span>':''}</div>
      <div class="meta nowrap">${esc(p.pos)} · ${esc(p.team)}</div></div>
      <span class="tag ${p.era==="legend"?"leg":"cur"}">${p.era==="legend"?"LEG":"NBA"}</span>`;
    const b=el("button","btn sm","Draft"); b.disabled=!canPick; b.style.marginLeft="8px";
    b.onclick=()=>makePick(p.id);
    row.appendChild(b); list.appendChild(row);
  });
  if(!pool.length)list.appendChild(el("div","prow","<span class='sub'>No players match.</span>"));
  layout.appendChild(left);

  // ---- right: tabs ----
  const right=el("div","side");
  const tabs=el("div","tabs");
  [["teams","All teams"],["me","My team"],["log","Pick log"]].forEach(([k,lab])=>{
    const t=el("div","tab"+(UI.tab===k?" on":""),lab);t.onclick=()=>{UI.tab=k;render();};tabs.appendChild(t);});
  right.appendChild(tabs);
  if(UI.tab==="log")right.appendChild(logPane());
  else if(UI.tab==="me")right.appendChild(teamPane(ME.uid,curUid));
  else { r.order.forEach(uid=>right.appendChild(teamCard(uid,curUid))); }
  layout.appendChild(right);
  v.appendChild(layout);

  // wire
  $("#q",v).oninput=e=>{UI.q=e.target.value; clearTimeout(window._qd); window._qd=setTimeout(render,180);};
  $("#sort",v).value=UI.sort; $("#sort",v).onchange=e=>{UI.sort=e.target.value;render();};
  const ub=$("#undoBtn",top); if(ub)ub.onclick=undoPick;
  $("#leaveBtn2",top).onclick=leave;
  startClock();
  return v;
}

function teamCard(uid,curUid){
  const r=ROOM; const picks=teamPicks(r,uid); const m=r.members[uid];
  const c=el("div","teamcard"+(uid===ME.uid?" me":"")+(uid===curUid?" turn":""));
  const need=r.cfg.rosterSize-picks.length;
  c.innerHTML=`<h4><span>${esc(m?.name||"?")}${uid===ME.uid?' <span class="sub" style="font-weight:500;font-size:12px">(you)</span>':''}</span>
    <span class="pill" style="padding:3px 9px">AVG ${avgOvr(picks)||"—"}</span></h4>
    <div class="sub" style="font-size:12px;margin-bottom:6px">${picks.length}/${r.cfg.rosterSize} picked · ${posBreak(picks)}</div>`;
  picks.slice().sort((a,b)=>b.ovr-a.ovr).forEach(p=>{
    c.appendChild(el("div","slot",`<span><span class="pos">${esc((p.pos||"").split("/")[0])}</span>${esc(p.name)}</span><b>${p.ovr}</b>`));
  });
  return c;
}
function teamPane(uid,curUid){
  const wrap=el("div"); wrap.appendChild(teamCard(uid,curUid));
  const r=ROOM, picks=teamPicks(r,uid);
  const need=POSES.filter(P=>!picks.some(p=>(p.pos||"").split("/").includes(P)));
  const tip=el("div","sub"); tip.style.fontSize="13px"; tip.style.marginTop="8px";
  tip.innerHTML= need.length? `Positions you still lack: <b>${need.join(", ")}</b>` : "You have every position covered ✓";
  wrap.appendChild(tip);
  return wrap;
}
function posBreak(picks){ const c={}; POSES.forEach(P=>c[P]=0);
  picks.forEach(p=>{const P=(p.pos||"").split("/")[0]; if(c[P]!=null)c[P]++;});
  return POSES.map(P=>`${P} ${c[P]}`).join(" · "); }
function logPane(){
  const r=ROOM; const wrap=el("div","logfeed"); const pk=r.picks||{};
  const keys=Object.keys(pk).map(Number).sort((a,b)=>b-a);
  if(!keys.length)wrap.appendChild(el("div","sub","No picks yet."));
  keys.forEach(k=>{const p=pk[k]; const m=r.members[p.uid];
    wrap.appendChild(el("div","li",`<b>#${k+1}</b> ${esc(m?.name||"?")} → <b>${esc(p.name)}</b> <span class="sub">(${p.ovr} ${esc(p.pos)})</span>`));});
  return wrap;
}

/* ---------- pick logic ---------- */
async function makePick(pid){
  const r=ROOM, pn=r.pickNo;
  if(pickerUidForPickNo(r,pn)!==ME.uid && ME.mode==="online")return toast("Not your turn");
  if(takenIds(r).has(pid))return toast("Already drafted");
  const p=PLAYER_BY_ID[pid];
  const obj={pid, name:p.name, ovr:p.ovr, pos:p.pos, nba:p.team, era:p.era, uid:pickerUidForPickNo(r,pn), ts:Date.now()};
  const next=nextState(r,pn);
  const ok=await store.pick(pn,obj,next);
  if(!ok)toast("Pick didn't go through — board moved on");
}
function nextState(r,pn){
  const np=pn+1; const done=np>=totalPicks(r);
  const next={pickNo:np};
  if(done)next.status="done";
  else next.deadline=r.cfg.timer?Date.now()+r.cfg.timer*1000:0;
  return next;
}
async function undoPick(){
  const r=ROOM; const pn=r.pickNo; if(pn<=0)return toast("Nothing to undo");
  const last=pn-1; const pk={...(r.picks||{})}; delete pk[last];
  await store.update({picks:pk, pickNo:last, status:"draft",
    deadline:r.cfg.timer?Date.now()+r.cfg.timer*1000:0});
  toast("Last pick undone");
}

/* auto-pick: host only drives the clock so there are no races */
function manageHostTimer(){
  const r=ROOM; if(!r)return;
  const isHost=ME.uid===r.host;
  if(!isHost||r.status!=="draft"||!r.cfg.timer){ if(autoTimer){clearInterval(autoTimer);autoTimer=null;} return; }
  if(autoTimer)return;
  autoTimer=setInterval(async()=>{
    const rr=ROOM; if(!rr||rr.status!=="draft"||!rr.cfg.timer){clearInterval(autoTimer);autoTimer=null;return;}
    if(rr.deadline && Date.now()>rr.deadline+400){
      // auto draft best available for current picker
      const taken=takenIds(rr); let pool=PLAYERS.filter(p=>!taken.has(p.id));
      if(rr.cfg.pool!=="all")pool=pool.filter(p=>p.era===rr.cfg.pool);
      pool.sort((a,b)=>b.ovr-a.ovr); const best=pool[0]; if(!best)return;
      const pn=rr.pickNo; const uid=pickerUidForPickNo(rr,pn);
      const obj={pid:best.id,name:best.name,ovr:best.ovr,pos:best.pos,nba:best.team,era:best.era,uid,ts:Date.now(),auto:true};
      await store.pick(pn,obj,nextState(rr,pn));
    }
  },1000);
}
function startClock(){
  if(tick)clearInterval(tick);
  tick=setInterval(()=>{
    const r=ROOM; const c=$("#clock"); if(!r||!c||r.status!=="draft"){return;}
    if(!r.cfg.timer){c.textContent="∞";return;}
    const left=Math.max(0,Math.ceil((r.deadline-Date.now())/1000));
    c.textContent=left; c.classList.toggle("warn",left<=10);
  },300);
}

/* ---------- results ---------- */
function standings(){
  const r=ROOM; return r.order.map(uid=>{const pk=teamPicks(r,uid);
    return {uid,name:r.members[uid]?.name||"?",picks:pk,avg:avgOvr(pk),sum:sumOvr(pk)};})
    .sort((a,b)=>b.avg-a.avg||b.sum-a.sum);
}
function resultsView(){
  const wrap=el("div"); const S=standings(); const maxAvg=S[0]?.avg||1;
  const head=el("div","card"); head.style.marginTop="16px";
  head.innerHTML=`<h2 style="margin:0 0 4px">🏆 Final standings</h2><div class="sub">Ranked by average overall rating</div>`;
  const grid=el("div"); grid.style.marginTop="14px";
  S.forEach((t,i)=>{
    const card=el("div","teamcard"+(t.uid===ME.uid?" me":""));
    card.innerHTML=`<h4><span><span class="num" style="margin-right:8px">${i+1}</span>${esc(t.name)}${t.uid===ME.uid?' <span class="sub" style="font-size:12px">(you)</span>':''} ${i===0?'<span class="tag" style="background:var(--gold);color:#1a1300">CHAMP</span>':''}</span>
      <span class="pill">AVG <b style="margin-left:4px">${t.avg}</b></span></h4>
      <div class="bar" style="margin:6px 0 10px"><i style="width:${Math.round(t.avg/maxAvg*100)}%"></i></div>`;
    const ros=el("div"); ros.style.display="grid"; ros.style.gridTemplateColumns="1fr 1fr"; ros.style.gap="0 14px";
    t.picks.slice().sort((a,b)=>b.ovr-a.ovr).forEach(p=>ros.appendChild(el("div","slot",`<span><span class="pos">${esc((p.pos||"").split("/")[0])}</span>${esc(p.name)}</span><b>${p.ovr}</b>`)));
    card.appendChild(ros); grid.appendChild(card);
  });
  head.appendChild(grid); wrap.appendChild(head); return wrap;
}
function exportResults(){
  const r=ROOM; const S=standings(); let csv="Rank,Team,AvgOVR,Player,OVR,Pos,From,Era\n";
  S.forEach((t,i)=>t.picks.slice().sort((a,b)=>b.ovr-a.ovr).forEach(p=>{
    csv+=`${i+1},"${t.name}",${t.avg},"${p.name}",${p.ovr},${p.pos},"${p.nba}",${p.era}\n`;}));
  const blob=new Blob([csv],{type:"text/csv"}); const a=el("a"); a.href=URL.createObjectURL(blob);
  a.download="2kdraft-results-"+ME.code+".csv"; a.click(); toast("Results exported as CSV");
}
function confetti(){
  const colors=["#1d9bf0","#f0531d","#ffc94d","#37d67a","#7b2ff7"];
  for(let i=0;i<120;i++){const c=el("div","confetti");c.style.left=Math.random()*100+"vw";
    c.style.background=colors[i%colors.length];c.style.animationDelay=Math.random()*0.6+"s";
    c.style.transform="rotate("+Math.random()*360+"deg)";document.body.appendChild(c);
    const dur=2200+Math.random()*1600, fall=()=>{c.animate([{transform:"translateY(0) rotate(0)"},
      {transform:`translateY(105vh) rotate(${Math.random()*720}deg)`}],{duration:dur,easing:"cubic-bezier(.3,.1,.6,1)"})
      .onfinish=()=>c.remove();}; fall();}
}

/* ---------- boot / reconnect ---------- */
(function boot(){
  const s=load();
  if(s&&s.code){
    if(s.mode==="online"&&FIREBASE_READY){
      store=CloudStore(); store.setCode(s.code);
      store.exists(s.code).then(ok=>{ if(!ok){localStorage.removeItem("nba2kdraft");render();return;}
        ME={uid:s.uid,name:s.name,isHost:s.isHost,code:s.code,mode:"online"}; store.subscribe(onRoom); });
      return;
    }
    // local mode can't be restored (in-memory) — clear
    localStorage.removeItem("nba2kdraft");
  }
  render();
})();
</script>
